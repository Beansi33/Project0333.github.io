<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn AI Chatbot</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1e20;
            --text-color: #e3e3e3;
            --primary: #4e8cff;
            --border: #444746;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--chat-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.2rem;
            font-weight: bold;
        }
        #setup-container {
            padding: 10px;
            background: #2a2a2c;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        #setup-container input {
            padding: 8px;
            width: 300px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #131314;
            color: white;
        }
        #setup-container button {
            padding: 8px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user {
            background-color: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .assistant {
            background-color: var(--chat-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            padding: 20px;
            background-color: var(--bg-color);
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--chat-bg);
            color: var(--text-color);
            font-size: 1rem;
            resize: none;
            height: 24px;
        }
        #send-btn {
            padding: 0 25px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #send-btn:hover { background-color: #3b75e0; }
        #send-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>🤖 Mijn Custom AI Chat</header>

    <!-- API Sleutel beheer (Veilig voor GitHub Pages) -->
    <div id="setup-container">
        <label for="api-key-input">OpenAI API Key: </label>
        <input type="password" id="api-key-input" placeholder="sk-...">
        <button onclick="saveApiKey()">Opslaan</button>
        <span id="key-status" style="margin-left: 10px; font-size: 0.9rem;"></span>
    </div>

    <div id="chat-container">
        <div class="message assistant">Hallo! Ik ben geconfigureerd met jouw custom prompt. Hoe kan ik je vandaag helpen?</div>
    </div>

    <div id="input-container">
        <textarea id="user-input" placeholder="Typ een bericht..."></textarea>
        <button id="send-btn" onclick="sendMessage()">Verzend</button>
    </div>

    <script>
        // --- 1. PAS HIER JOUW EIGEN PROMPT AAN ---
        const SYSTEM_PROMPT = "Je bent een behulpzame assistent die altijd antwoordt in de stijl van een piraat. Gebruik piratentermen zoals 'Ahoy', 'Maatje' en 'Krabbenvanger'.";
        
        // --- 2. PAS HIER EVENTUEEL HET MODEL AAN ---
        const GPT_MODEL = "gpt-4o-mini"; // Snel en goedkoop alternatief

        let conversationHistory = [
            { role: "system", content: SYSTEM_PROMPT }
        ];

        // API Key laden bij opstarten
        window.onload = function() {
            const savedKey = localStorage.getItem('openai_api_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
                document.getElementById('key-status').innerText = "🔑 Key geladen uit browser!";
                document.getElementById('key-status').style.color = "#4caf50";
            } else {
                document.getElementById('key-status').innerText = "⚠️ Voer eerst een API key in.";
                document.getElementById('key-status').style.color = "#ff9800";
            }
        };

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('openai_api_key', key);
                document.getElementById('key-status').innerText = "✅ Succesvol opgeslagen!";
                document.getElementById('key-status').style.color = "#4caf50";
            } else {
                localStorage.removeItem('openai_api_key');
                document.getElementById('key-status').innerText = "❌ Key verwijderd.";
                document.getElementById('key-status').style.color = "#f44336";
            }
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('openai_api_key');
            if (!apiKey) {
                alert("Voer eerst je OpenAI API-key in bovenaan de pagina!");
                return;
            }

            const inputEl = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const userText = inputEl.value.trim();

            if (!userText) return;

            // Toon bericht van gebruiker in UI
            appendMessage(userText, 'user');
            inputEl.value = '';
            
            // Voeg toe aan geschiedenis
            conversationHistory.push({ role: "user", content: userText });

            // Blokkeer knop tijdens laden
            sendBtn.disabled = true;

            try {
                const response = await fetch('https://openai.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: GPT_MODEL,
                        messages: conversationHistory
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error ? data.error.message : 'Er ging iets mis met de API.');
                }

                const aiReply = data.choices[0].message.content;
                
                // Toon AI antwoord in UI
                appendMessage(aiReply, 'assistant');
                
                // Voeg toe aan geschiedenis
                conversationHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                console.error(error);
                appendMessage(`Fout: ${error.message}`, 'assistant');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById('chat-container');
            const messageEl = document.createElement('div');
            messageEl.classList.add('message', sender);
            messageEl.innerText = text;
            chatContainer.appendChild(messageEl);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Verzenden met Enter-toets (zonder shift)
        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
